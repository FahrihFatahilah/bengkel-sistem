version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bengkel-app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - bengkel-storage:/var/www/html/storage/app
      - bengkel-logs:/var/www/html/storage/logs
    environment:
      - APP_NAME=Bengkel
      - APP_ENV=production
      - APP_KEY=base64:Q0KP94HeBsqK1YXQLjyVXxxun8U00Gw50jrTduiBo84=
      - APP_DEBUG=false
      - APP_URL=https://bengkel.ffatahilah.my.id
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=bengkel
      - DB_USERNAME=ffatahilah
      - DB_PASSWORD=OmbaInam#121221
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bengkel.rule=Host(`bengkel.ffatahilah.my.id`)"
      - "traefik.http.routers.bengkel.entrypoints=websecure"
      - "traefik.http.routers.bengkel.tls=true"
      - "traefik.http.routers.bengkel.tls.certresolver=letsencrypt"
      - "traefik.http.services.bengkel.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_net"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  bengkel-storage:
    driver: local
  bengkel-logs:
    driver: local
